<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f4c81">
  <title>SILAGU</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(29,122,140,.18), transparent 30%),
        linear-gradient(135deg, #eef5fa, #f8fbfd 55%, #e8f1f7);
      color: #1f2937;
      padding: 24px;
    }

    .loader-card {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,.96);
      border-radius: 24px;
      box-shadow: 0 22px 60px rgba(15,76,129,.16);
      padding: 42px 32px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.85);
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 20px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f4c81, #1d7a8c);
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(15,76,129,.22);
    }

    h1 {
      color: #0a365c;
      font-size: 32px;
      margin-bottom: 8px;
    }

    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 26px auto 18px;
      border-radius: 50%;
      border: 4px solid #dbe5ee;
      border-top-color: #0f4c81;
      animation: spin .8s linear infinite;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #475569;
    }

    .error {
      color: #9b2c2c;
      background: #fdecec;
      border: 1px solid #f4c7c3;
      border-radius: 10px;
      padding: 12px;
      margin-top: 18px;
      display: none;
      text-align: left;
      line-height: 1.5;
      font-size: 13px;
    }

    .btn {
      display: none;
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #0f4c81, #1d7a8c);
      color: #fff;
      font-weight: 800;
      padding: 14px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <main class="loader-card">
    <div class="logo">S</div>

    <h1>SILAGU</h1>

    <p>
      Sistem Administrasi Guru Terintegrasi
    </p>

    <div class="spinner" id="spinner"></div>

    <div class="status" id="status">
      Memeriksa sesi pengguna...
    </div>

    <div class="error" id="errorBox"></div>

    <button class="btn" id="loginBtn" type="button">
      BUKA HALAMAN LOGIN
    </button>
  </main>


<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwdZVSuw0vXn5dJA9Krh2MOwcI95Ynh6emYMphPtaONoX6xXq0L6q558hVRbIl6disp/exec";


const ROLE_REDIRECT = {
  SUPERADMIN: "dashboard-admin.html",
  PENGAWAS: "dashboard-pengawas.html",
  KEPALA_SEKOLAH: "dashboard-kepsek.html",
  GURU: "dashboard-guru.html"
};


const statusText =
  document.getElementById("status");

const spinner =
  document.getElementById("spinner");

const errorBox =
  document.getElementById("errorBox");

const loginBtn =
  document.getElementById("loginBtn");


function clearSession() {
  localStorage.removeItem("silagu_token");
  localStorage.removeItem("silagu_user");
  localStorage.removeItem("silagu_expires_at");
}


function goLogin() {
  window.location.replace("login.html");
}


function redirectByRole(role) {
  const normalizedRole =
    String(role || "")
      .trim()
      .toUpperCase();

  const target =
    ROLE_REDIRECT[normalizedRole];

  if (!target) {
    clearSession();
    goLogin();
    return;
  }

  window.location.replace(target);
}


async function apiPost(payload) {
  const response =
    await fetch(
      API_URL,
      {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload),
        redirect: "follow"
      }
    );

  if (!response.ok) {
    throw new Error("Server SILAGU tidak dapat dihubungi.");
  }

  const text =
    await response.text();

  try {
    return JSON.parse(text);
  }
  catch (error) {
    throw new Error("Respons server tidak valid.");
  }
}


async function startApp() {

  const token =
    localStorage.getItem("silagu_token");

  if (!token) {
    statusText.textContent =
      "Belum ada sesi aktif. Membuka halaman login...";

    setTimeout(goLogin, 350);
    return;
  }


  try {

    statusText.textContent =
      "Memvalidasi sesi dengan server SILAGU...";


    const result =
      await apiPost({
        action: "validateSession",
        token: token
      });


    if (!result.valid) {
      clearSession();

      statusText.textContent =
        "Sesi telah berakhir. Membuka halaman login...";

      setTimeout(goLogin, 400);
      return;
    }


    const currentUserResult =
      await apiPost({
        action: "getCurrentUser",
        token: token
      });


    if (
      !currentUserResult.success ||
      !currentUserResult.user
    ) {

      clearSession();

      statusText.textContent =
        "Data pengguna tidak ditemukan.";

      setTimeout(goLogin, 500);
      return;

    }


    localStorage.setItem(
      "silagu_user",
      JSON.stringify(currentUserResult.user)
    );


    statusText.textContent =
      "Sesi aktif. Membuka dashboard...";


    redirectByRole(
      currentUserResult.user.role
    );

  }

  catch (error) {

    spinner.style.display =
      "none";

    statusText.textContent =
      "Gagal terhubung ke server.";

    errorBox.style.display =
      "block";

    errorBox.textContent =
      error.message +
      " Silakan buka halaman login dan coba kembali.";

    loginBtn.style.display =
      "block";

  }

}


loginBtn.addEventListener(
  "click",
  goLogin
);


window.addEventListener(
  "DOMContentLoaded",
  startApp
);

</script>

</body>
</html>
